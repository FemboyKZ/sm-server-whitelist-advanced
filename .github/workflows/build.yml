name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"

      - name: Compile
        run: |
          mkdir -p build/addons/sourcemod/plugins build/addons/sourcemod/scripting
          spcomp -i include serverwhitelistadvanced.sp -o build/addons/sourcemod/plugins/serverwhitelistadvanced.smx
          cp serverwhitelistadvanced.sp build/addons/sourcemod/scripting/
          cp -r include build/addons/sourcemod/scripting/

      - uses: actions/upload-artifact@v7
        with:
          name: serverwhitelistadvanced
          path: build/

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: cd build && zip -r ../serverwhitelistadvanced-${{ github.ref_name }}.zip addons

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: serverwhitelistadvanced-${{ github.ref_name }}.zip
